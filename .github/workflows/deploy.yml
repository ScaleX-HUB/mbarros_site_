name: VPS Auto Deploy

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOKKU_APP_NAME: ${{ vars.DOKKU_APP_NAME }}
    steps:
      - name: Validate deploy configuration
        shell: bash
        env:
          DOKKU_APP_NAME: ${{ vars.DOKKU_APP_NAME }}
          VPS_OS_PASSWORD: ${{ secrets.VPS_OS_PASSWORD }}
          GITHUB_DOKKU_TOKEN: ${{ secrets.GITHUB_DOKKU_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$DOKKU_APP_NAME" ] || missing+=("Repository variable DOKKU_APP_NAME")
          [ -n "$VPS_OS_PASSWORD" ] || missing+=("Repository secret VPS_OS_PASSWORD")
          [ -n "$GITHUB_DOKKU_TOKEN" ] || missing+=("Repository secret GITHUB_DOKKU_TOKEN")

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy configuration:\n'
            printf ' - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: SSH Trigger Dokku Git Sync
        uses: appleboy/ssh-action@v1.2.2
        env:
          VPS_OS_PASSWORD: ${{ secrets.VPS_OS_PASSWORD }}
          GITHUB_DOKKU_TOKEN: ${{ secrets.GITHUB_DOKKU_TOKEN }}
          DEPLOY_BRANCH: main
          DEPLOY_REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          host: 157.173.118.98
          username: converseia
          password: ${{ secrets.VPS_OS_PASSWORD }}
          envs: DOKKU_APP_NAME,VPS_OS_PASSWORD,GITHUB_DOKKU_TOKEN,DEPLOY_BRANCH,DEPLOY_REPOSITORY,DEPLOY_SHA,DEPLOY_COMMIT_MESSAGE
          script: |
            set -euo pipefail
            if [ -z "$DOKKU_APP_NAME" ]; then
              echo "DOKKU_APP_NAME nao definido nas variaveis do repositorio."
              exit 1
            fi
            COMMIT_NAME=$(printf '%s' "$DEPLOY_COMMIT_MESSAGE" | head -n 1)
            if [ -z "$COMMIT_NAME" ]; then COMMIT_NAME="$DEPLOY_SHA"; fi
            printf '%s\n' "$VPS_OS_PASSWORD" | sudo -S dokku config:set --no-restart "$DOKKU_APP_NAME" DEPLOYED_BRANCH="$DEPLOY_BRANCH" DEPLOYED_REPO_URL="https://github.com/$DEPLOY_REPOSITORY.git" DEPLOYED_COMMIT_SHA="$DEPLOY_SHA" DEPLOYED_COMMIT_NAME="$COMMIT_NAME" DEPLOYED_COMMIT_URL="https://github.com/$DEPLOY_REPOSITORY/commit/$DEPLOY_SHA"
            printf '%s\n' "$VPS_OS_PASSWORD" | sudo -S dokku git:sync --build "$DOKKU_APP_NAME" "https://x-access-token:$GITHUB_DOKKU_TOKEN@github.com/$DEPLOY_REPOSITORY.git" "$DEPLOY_BRANCH"
